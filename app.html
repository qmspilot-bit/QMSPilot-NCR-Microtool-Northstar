<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMSPilot Northstar</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#050a13}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{height:58px;background:#06111f;color:#eaf3ff;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid rgba(125,181,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:3}.bar img{height:31px;width:auto}.bar .workspace{font-size:13px;color:#9fb6cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar strong{color:#fff}.spacer{flex:1}.pill{font-size:11px;font-weight:800;border:1px solid rgba(125,181,255,.3);background:rgba(31,111,206,.12);padding:7px 10px;border-radius:999px}.out{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.frame{width:100%;height:100%;border:0;background:#edf2f8}.loading{position:fixed;inset:58px 0 0;background:#07111f;color:#d9e8f8;display:grid;place-items:center;z-index:4}.loading div{text-align:center}.loading b{display:block;font-size:18px;margin-bottom:7px}.error{color:#ffd2d7;max-width:620px;line-height:1.5}</style></head><body><div class="shell"><div class="bar"><img src="assets/northstar.jpg" alt="Northstar"><div class="workspace"><strong id="org">Secure workspace</strong> · <span id="email"></span></div><span id="demo" class="pill" hidden>QMSPILOT DEMO</span><div class="spacer"></div><button id="signout" class="out">Sign out</button></div><iframe id="tool" class="frame" title="Northstar NCR workspace"></iframe></div><div id="loading" class="loading"><div><b>Opening your secure workspace…</b><span>Verifying tenant access and isolating workspace data.</span></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://mcdxriothpcadqcaarui.supabase.co',KEY='sb_publishable_11Ksxo9Ik9AsvprxZMK5PA_V73t48Nw';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const GLOBAL='qmspilot.ncr.v2.current',QUEUE='qmspilot.northstar.queue';let tenantKey='',queueKey='';const loading=document.getElementById('loading');function die(msg){loading.innerHTML='<div class="error"><b>Workspace unavailable</b>'+msg+'</div>'}
(async()=>{const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace('index.html');return}const user=session.user;document.getElementById('email').textContent=user.email||'';const {data:memberships,error:memErr}=await sb.from('organization_memberships').select('organization_id,role,status,organizations(id,name,slug,is_demo)').eq('user_id',user.id).eq('status','active').limit(1);if(memErr||!memberships?.length){die('Your account does not have an active organization membership. Contact QMSPilot support.');return}const m=memberships[0],org=m.organizations;document.getElementById('org').textContent=org.name;document.getElementById('demo').hidden=!org.is_demo;localStorage.setItem('qmspilot.tenant_id',m.organization_id);localStorage.setItem('qmspilot.organization_name',org.name);localStorage.setItem('qmspilot.user_id',user.id);localStorage.setItem('qmspilot.user_email',user.email||'');localStorage.setItem('qmspilot.user_role',m.role);localStorage.setItem('qmspilot.is_demo',String(!!org.is_demo));tenantKey='qmspilot.tenant.'+m.organization_id+'.ncr.v2.current';queueKey='qmspilot.tenant.'+m.organization_id+'.northstar.queue';if(org.is_demo){if(!localStorage.getItem(tenantKey)&&localStorage.getItem(GLOBAL))localStorage.setItem(tenantKey,localStorage.getItem(GLOBAL));}else{localStorage.removeItem(GLOBAL);localStorage.removeItem(QUEUE)}if(localStorage.getItem(tenantKey))localStorage.setItem(GLOBAL,localStorage.getItem(tenantKey));else localStorage.removeItem(GLOBAL);if(localStorage.getItem(queueKey))localStorage.setItem(QUEUE,localStorage.getItem(queueKey));else localStorage.removeItem(QUEUE);const frame=document.getElementById('tool');frame.onload=()=>{loading.style.display='none';try{const w=frame.contentWindow,d=w.document;const nativeFetch=w.fetch.bind(w);w.fetch=(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(url.startsWith(URL+'/functions/v1/')){const headers=new Headers(init.headers||{});headers.set('Authorization','Bearer '+session.access_token);headers.set('apikey',KEY);return nativeFetch(input,{...init,headers})}return nativeFetch(input,init)};const orgInput=d.getElementById('organizationId');if(orgInput)orgInput.value=m.organization_id;const userInput=d.getElementById('northstarUserId');if(userInput)userInput.value=user.id;const company=d.getElementById('company');if(company&&!company.value)company.value=org.name;const submitter=d.getElementById('submitterEmail');if(submitter&&!submitter.value)submitter.value=user.email||'';w.refreshAll?.()}catch(e){console.warn(e)}};frame.src='legacy-tool.html';setInterval(()=>{const v=localStorage.getItem(GLOBAL);if(v!=null)localStorage.setItem(tenantKey,v);const q=localStorage.getItem(QUEUE);if(q!=null)localStorage.setItem(queueKey,q)},500)})();
document.getElementById('signout').onclick=async()=>{if(tenantKey&&localStorage.getItem(GLOBAL))localStorage.setItem(tenantKey,localStorage.getItem(GLOBAL));localStorage.removeItem(GLOBAL);localStorage.removeItem(QUEUE);await sb.auth.signOut();location.replace('index.html')};
</script></body></html>
